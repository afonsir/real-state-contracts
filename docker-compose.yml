version: '3.7'

services:
  postgresqldb:
    image: postgres:18.0-alpine3.22
    container_name: postgresqldb
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
